[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forum-counter"
version = "0.1.0"
description = "Application desktop simple pour enregistrer les visiteurs d'un forum."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6,<7",
    "PyYAML>=6.0,<7",
]

[project.scripts]
forum-counter = "forum_counter.main:main"

[tool.setuptools.packages.find]
where = ["src"]
